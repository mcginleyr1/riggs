# Riggs Endpoint Protection - Configuration

[sensor]
enabled_sources = ["process", "file", "network", "dns", "auth"]
poll_interval_ms = 100

[engine]
static_ai_enabled = true
behavioral_ai_enabled = true
rules_enabled = true
# Weighted-merge sensitivity: final verdict is Malicious at/above the first,
# Suspicious at/above the second. Lower = more sensitive (more alerts).
merge_malicious_threshold = 0.7
merge_suspicious_threshold = 0.3
# Resource limits (advanced — sane defaults; raise for big hosts, lower for tiny).
static_ai_max_scan_mib = 64                 # max bytes read per file for static AI
stage_timeout_ms = 5000                     # per-stage wait (> 0); a file analysis that runs over is reported Suspicious
behavioral_max_events_per_storyline = 512
behavioral_max_storylines = 4096
storyline_max_events = 1024
storyline_idle_secs = 3600                  # prune storylines idle this long
storyline_prune_interval_secs = 60          # how often to run the prune sweep
static_ai_model_path = "/var/lib/riggs/models/static.onnx"
health_check_secs = 30                       # supervisor health/restart cadence
retention_sweep_secs = 21600                 # how often retention cleanup runs (6h)

[store]
db_path = "/var/lib/riggs/riggs.db"
retention_days = 90
compression_enabled = true
# Writes are batched into one transaction: flush when `batch_max` pairs queue up
# or `batch_flush_ms` elapses, whichever comes first. Higher batch_max = fewer
# fsyncs under load but more events lost if the host crashes mid-batch.
batch_max = 64
batch_flush_ms = 250

[rules]
rules_dir = "/etc/riggs/rules"

[comms]
socket_path = "/var/run/riggs.sock"
# macOS: root-only (0600, uid 0) socket for the sandboxed riggs-filter Network
# Extension, inside its app group "<TEAM_ID>.com.riggs" under root's home.
# Change the Team ID here if you build the filter with another one.
filter_socket_path = "/private/var/root/Library/Group Containers/3KSC5YWCZ6.com.riggs/riggs-filter.sock"
cloud_enabled = false
# cloud_endpoint = "https://console.example.com"
heartbeat_interval_secs = 60
# Refuse to send the enrollment token over a non-https endpoint. Set false only
# for deployments that terminate TLS elsewhere or deliberately accept cleartext.
require_tls = true
# Local IPC guards (advanced): max request frame size and concurrent clients.
ipc_max_message_bytes = 8388608   # 8 MiB
ipc_max_connections = 32

# mTLS to the Murtaugh console (bring-your-own-PKI). Required for an https://
# cloud_endpoint: the agent refuses to send its enrollment token over cleartext.
# ca_cert_path verifies the console's server cert; client_cert/key authenticate
# this agent (both signed by your organization's CA).
# [comms.tls]
# ca_cert_path     = "/etc/riggs/tls/ca.pem"
# client_cert_path = "/etc/riggs/tls/agent.pem"
# client_key_path  = "/etc/riggs/tls/agent-key.pem"
# domain_name      = "murtaugh.example.com"   # if cert CN/SAN differs from dial host

[response]
# "off": nothing is evaluated. "record": the policy runs and each action it would take is
# stored as not executed (see `riggs threats`). "act": actions run and are stored.
mode = "record"
kill_on_critical = true                  # false removes KillProcess from the policy
quarantine_on_malicious = true           # false removes QuarantineFile from the policy
# Kill and suspend never target these (full paths; a bare name matches any process using it).
protected_processes = [
  "/sbin/launchd",                       # PID 1: its death panics the kernel
  "/System/Library/PrivateFrameworks/SkyLight.framework/Resources/WindowServer",   # draws every window
  "/System/Library/CoreServices/loginwindow.app/Contents/MacOS/loginwindow",       # owns the login session
]
quarantine_path = "/var/lib/riggs/quarantine"
pf_conf_path = "/var/lib/riggs/pf-containment.conf"   # macOS containment ruleset (off /tmp)
preemptive_snapshots = true              # copy files a threat storyline opens, for Rollback
snapshot_path = "/var/lib/riggs/snapshots"
snapshot_max_file_mib = 64
snapshot_retention_hours = 24

# JSON-lines export for a log collector (Splunk, Elastic, Datadog agent...): threats, response
# records, daemon start/stop/heartbeat, and policy reloads/rejections/deletions. See docs/EXPORT.md.
# Off until jsonl_path is set. The file is created 0640.
[export]
# jsonl_path = "/var/log/riggs/events.jsonl"
# max_bytes = 67108864                   # renamed to events.jsonl.1 and restarted past this size
# heartbeat_secs = 60                    # alert on silence longer than a few of these

# Behavioral detection tuning and signatures (adjust sensitivity per environment).
[detection]
exfil_outbound_threshold = 50            # external conns that corroborate archive staging as exfiltration
rapid_encryption_file_threshold = 10     # distinct files in the window -> ransomware
rapid_encryption_window_secs = 5
threat_score_threshold = 0.5             # storyline score to treat as a threat
persistence_paths = [
  "/Library/LaunchDaemons", "/Library/LaunchAgents", "~/Library/LaunchAgents",
  ".config/autostart", "/etc/cron.d", "/etc/crontab", "/var/spool/cron",
  "/etc/systemd/system", "/usr/lib/systemd/system", "/etc/init.d", "/etc/rc.local",
  "/.ssh/authorized_keys",   # also matches authorized_keys2
]
# After-the-click rules (alert-only, see docs/DETECTION_PIPELINE.md). A missing
# key takes the default below; an empty list turns off the rule it drives.
download_recent_hours = 24               # macOS: a download mark younger than this counts (0 = off)
# Executable basenames; "python3" also matches "python3.12". macOS runs python3 as "Python".
interpreters = ["sh", "bash", "zsh", "dash", "ksh", "csh", "tcsh", "python3", "Python", "perl", "ruby", "osascript"]
downloaders = ["curl", "wget"]
# Mail, browser and chat apps (executable basenames) whose shell or downloader children are flagged.
lure_parents = [
  "Safari", "Google Chrome", "chromium", "firefox", "firefox-esr",
  "Mail", "Microsoft Outlook", "thunderbird",
  "Slack", "Discord", "Signal", "Telegram",
]
# A program whose executable sits directly in one of these is flagged when run.
temp_exec_dirs = ["/tmp", "/private/tmp", "/var/tmp", "/private/var/tmp"]
# Linux: opening one of these (a path substring; "*" matches any run) is flagged unless the
# opener's executable starts with a credential_readers prefix (keep those root-owned).
# Off by default: a browser or keyring whose install directory is not a reader alerts on
# every open of its own store. To enable, add this host's browser and keyring install
# directories to the readers, then use lists like these (Debian packages and the Firefox
# snap; Google Chrome, Brave and Edge are not covered):
# credential_paths = [
#   "/.config/chromium/*/Cookies", "/.config/chromium/*/Login Data",
#   "/.mozilla/firefox/*/cookies.sqlite", "/.mozilla/firefox/*/logins.json", "/.mozilla/firefox/*/key4.db",
#   "/.local/share/keyrings/", "/.local/share/kwalletd/",
#   "/.ssh/id_",
# ]
# credential_readers = [
#   "/usr/lib/chromium/", "/usr/lib/firefox-esr/", "/snap/firefox/",
#   "/usr/bin/ssh", "/usr/lib/openssh/",
#   "/usr/bin/gnome-keyring", "/usr/bin/kwalletd", "/usr/bin/ksecretd",
# ]
credential_paths = []
credential_readers = []

[intel]
enabled = true
cache_path = "/var/lib/riggs/intel_cache.db"
cache_ttl_clean_hours = 24
cache_ttl_malicious_hours = 168
# Malware-hash bloom filter (advanced): initial capacity + target FP rate.
bloom_capacity = 1000000
bloom_false_positive_rate = 0.001

[intel.virustotal]
# At most 4 lookups a minute (free-tier quota). Further feed-matched hashes are
# reported Suspicious unconfirmed; a later scan confirms them (verdicts are cached).
enabled = false
api_key = ""

[intel.abuseipdb]
enabled = false
api_key = ""

[intel.feeds]
# MalwareBazaar and URLhaus exports need an abuse.ch Auth-Key (free account at
# https://auth.abuse.ch/). Left empty, those two feeds stay off.
abusech_auth_key = ""
malwarebazaar_enabled = true
malwarebazaar_interval_hours = 24
urlhaus_enabled = true
urlhaus_interval_hours = 1
osv_enabled = true
osv_interval_hours = 24

# Data Loss Prevention
[dlp]
enabled = true
action = "block"            # "block" or "alert"
correlation_window_secs = 30

[[dlp.watched_domains]]
pattern = "claude.ai"
category = "ai-assistant"

[[dlp.watched_domains]]
pattern = "*.anthropic.com"
category = "ai-assistant"

[[dlp.watched_domains]]
pattern = "chatgpt.com"
category = "ai-assistant"

[[dlp.watched_domains]]
pattern = "*.openai.com"
category = "ai-assistant"

[dlp.file_types]
block = ["pptx", "xlsx", "docx", "pdf", "ppt", "xls", "doc"]
alert = ["csv", "json"]

[dlp.excluded_processes]
names = ["softwareupdated", "nsurlsessiond"]
