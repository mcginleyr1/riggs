# Riggs phishing policy: the only switch for phishing protection. Every key is required; a
# missing, unknown or misspelled key stops the file from loading, and a bad edit while the daemon
# runs keeps the policy it had.
#
# Every weight below is 0.0 until it has been measured on real mail. With all weights at zero only
# the hard lookalike rules (domain_lookalike_misspelling, domain_lookalike_embedded) and the page
# context rule (page_from_mail_unknown_login, page_from_flagged_mail) can produce a verdict.
#
# Cue ids and their rules: docs/PHISHING_CUES.md. Phrases: only the seeds in its section 4.

mode = "monitor"            # off: no checks; monitor: check and log, never show; warn: show verdicts
caution_threshold = 1.0     # summed soft-cue weight at which a mail is "caution"; no effect while every weight is 0
warmup_logins = 20          # logins recorded before the page context rule fires (an unmeasured guess)
max_logins = 2000           # login domains kept per user; past it new logins are refused
max_senders = 20000         # sender keys kept per user; past it new senders are not recorded

# Lookalike guards. Starting guesses, to be measured on a top-sites list. Label lengths count the
# characters of the known (login-set) domain's label.
[lookalike]
homoglyph_min_label = 4     # homoglyph rule: known label at least this long
typo_min_label = 6          # one-edit typo rule: known label at least this long
typo_same_first_char = true # typo rule: the candidate starts with the same character
typo_trailing_s_exempt = true # typo rule: adding or dropping a final "s" is not a typo
embedded_min_domain = 6     # embedded rule: known registrable domain at least this long
embedding_ignore = []       # registrable domains of hosts that may carry a known domain inside; none measured yet
brand_token_min_label = 5   # brand-token rule and brand_name_in_freemail_sender: known label at least this long
brand_prefix_min_label = 6  # brand-token rule, prefix form: known label at least this long

# One weight per soft cue. A weight's sign and size come from measurement.
[weights]
# Need history.
domain_lookalike_brand_token = 0.0
domain_lookalike_suffix_swap = 0.0
brand_name_in_freemail_sender = 0.0
sender_never_seen = 0.0
reply_to_unsent_message = 0.0
attachment_from_unseen_sender = 0.0
# Sender and structure.
display_name_address_mismatch = 0.0
authority_role_sender_name = 0.0
link_text_target_mismatch = 0.0
link_text_hides_url = 0.0
link_only_body = 0.0
link_target_high_risk_file = 0.0
attachment_present = 0.0
attachment_high_risk_type = 0.0
attachment_type_differs_from_body_mention = 0.0
# Phrase lists.
urgency = 0.0
threat_of_consequence = 0.0
request_sensitive_information = 0.0
request_payment = 0.0
account_problem_claim = 0.0
click_or_open_request = 0.0
generic_greeting = 0.0
legal_boilerplate = 0.0
security_indicator_text = 0.0
too_good_to_be_true_offer = 0.0
exclusive_offer_for_you = 0.0
limited_time_offer = 0.0
humanitarian_appeal = 0.0
mimics_business_process = 0.0
compromising_picture_lure = 0.0
# Engineering: the sensor had to cut the mail to fit.
observation_truncated = 0.0

# One phrase list per phrase cue: exactly the seeds of docs/PHISHING_CUES.md section 4. Matching
# ignores case and runs of whitespace, and needs a word boundary at each end. Subject and body
# are searched, except: generic_greeting reads the first three non-empty body lines,
# authority_role_sender_name the display name and the last five non-empty body lines, and
# security_indicator_text the body only.
[phrases]
urgency = [
    "immediately",                      # NIST B.4.4 (p. 34); Appendix B Figure 4 (p. 35)
    "URGENT",                           # CISA-TIP p. 2, sample subject
    "must be verified now",             # KB4-blog, "Stressor Events"
]
threat_of_consequence = [
    "disciplinary action may be taken", # NIST Appendix B Figure 4 (p. 35)
    "permanently locked",               # KB4-blog, "Stressor Events"
]
request_sensitive_information = [
    "your network credentials",         # NIST Appendix B Figure 4 (p. 35)
    "login credentials",                # NIST B.4.3 (p. 34)
    "social security number",           # NIST B.4.3 (p. 34)
    "account information",              # CISA-ASE, "What is a phishing attack?"
    "confirm some personal or financial information", # FTC list item 3
]
request_payment = [
    "wire me $300",                     # KB4 sample email
    "Process an invoice",               # KB4-blog, list of unexpected requests
    "Change banking or payroll information", # KB4-blog, list of unexpected requests
    "Buy gift cards",                   # KB4-blog, list of unexpected requests
    "make a payment",                   # FTC list item 5
    "update your payment details",      # FTC example sign 3
]
account_problem_claim = [
    "There is a problem with your recent order.", # CISA-TIP p. 2
    "suspicious activity or log-in attempts", # FTC list item 1
    "a problem with your account or your payment information", # FTC list item 2
    "your account is on hold because of a billing problem", # FTC example sign 2
]
click_or_open_request = [
    "Please click here",                # CISA-TIP p. 2
]
generic_greeting = [
    "Dear Valued Customer",             # CISA-ASE indicator 2
    "Sir/Ma'am",                        # CISA-ASE indicator 2
    "Dear user,",                       # CISA-TIP p. 2
]
legal_boilerplate = [
    "Do not reply to this email.",      # NIST Appendix B Figure 4 (p. 35)
]
security_indicator_text = [
    "digitally signed",                 # NIST B.3.4 (p. 32)
]
too_good_to_be_true_offer = [
    "FREE",                             # NIST Appendix B Figure 5 (p. 37)
    "Gift Certificate has arrived!",    # NIST Appendix B Figure 5 (p. 37)
    "contest",                          # NIST Table 2 (p. 9)
    "lottery",                          # NIST Table 2 (p. 9)
    "free vacation",                    # NIST Table 2 (p. 9)
    "a government refund",              # FTC list item 6
    "a coupon for free stuff",          # FTC list item 7
]
exclusive_offer_for_you = [
    "Your Restaurant Gift Certificate is here!", # NIST Appendix B Figure 5 (p. 37), subject
    "a valentine e-card",               # NIST B.5.3 (p. 36)
    "a special birthday coupon",        # NIST B.5.3 (p. 36)
]
limited_time_offer = [
    "Offer expires in 14 days",         # NIST Appendix B Figure 5 (p. 37)
]
humanitarian_appeal = [
    "donate your gift certificate to a family in need", # NIST Appendix B Figure 5 (p. 37)
]
mimics_business_process = [
    "voicemail notification",           # NIST B.5.5 (p. 36)
    "package delivery",                 # NIST B.5.5 (p. 36)
    "new voicemail",                    # NIST Table 2 (p. 9)
    "order confirmation",               # NIST Table 2 (p. 9)
    "notice of invoice",                # NIST Table 2 (p. 9)
    "Unpaid invoice",                   # NIST Appendix B Figure 1 (p. 29), subject; B.5.5 (p. 36)
    "Unauthorized Web Site Access",     # NIST Appendix B Figure 2 (p. 31), subject; B.5.5 (p. 36)
    "Your Recent Order",                # CISA-TIP p. 2, subject
]
authority_role_sender_name = [
    "Human Resources",                  # NIST Appendix B Figure 5 (p. 37), From name
    "System Administrator",             # NIST Appendix B Figure 2 (p. 31), From name
    "IT Helpdesk",                      # NIST B.2.2 (p. 30)
    "Your CEO",                         # KB4 sample email, sign-off
]
compromising_picture_lure = []          # KB4 CONTENT 5 names the cue but no phrase; to be measured

# File extensions, lowercase with their dot; an attachment's or link's last extension is compared.
[extensions]
# attachment_high_risk_type and link_target_high_risk_file.
high_risk = [
    ".scr",                             # CISA-GUIDE p. 7 and p. 9
    ".exe",                             # CISA-GUIDE p. 7 and p. 9
    ".pif",                             # CISA-GUIDE p. 7
    ".cpl",                             # CISA-GUIDE p. 7
]
# attachment_type_differs_from_body_mention: the extensions a body can name.
body_mention = [
    ".doc",                             # NIST Appendix B Figure 1 (p. 29)
    ".zip",                             # NIST Appendix B Figure 1 (p. 29); NIST B.2.1 (p. 30)
    ".jpeg",                            # NIST B.2.1 (p. 30)
    ".pdf",                             # NIST B.2.1 (p. 30)
    ".exe",                             # NIST B.2.1 (p. 30); CISA-GUIDE p. 7
    ".txt",                             # KB4 ATTACHMENTS 2
    ".scr",                             # CISA-GUIDE p. 7
    ".pif",                             # CISA-GUIDE p. 7
    ".cpl",                             # CISA-GUIDE p. 7
]

